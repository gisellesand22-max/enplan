<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D8E8D0"/>
      <stop offset="100%" stop-color="#C2D8B8"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" rx="20" fill="url(#bg)"/>
  <!-- Dumbbell -->
  <g transform="translate(40,40) rotate(-30)">
    <!-- Bar -->
    <rect x="-22" y="-2.5" width="44" height="5" rx="2.5" fill="#A8A294" stroke="#2B2B23" stroke-width="1.2"/>
    <!-- Left weight outer -->
    <rect x="-26" y="-10" width="8" height="20" rx="3" fill="#2B2B23"/>
    <!-- Left weight inner -->
    <rect x="-24" y="-8" width="4" height="16" rx="2" fill="#3D3D33"/>
    <!-- Right weight outer -->
    <rect x="18" y="-10" width="8" height="20" rx="3" fill="#2B2B23"/>
    <!-- Right weight inner -->
    <rect x="20" y="-8" width="4" height="16" rx="2" fill="#3D3D33"/>
    <!-- Grip texture -->
    <line x1="-4" y1="-2" x2="-4" y2="2" stroke="#2B2B23" stroke-width="0.8" opacity="0.3"/>
    <line x1="0" y1="-2" x2="0" y2="2" stroke="#2B2B23" stroke-width="0.8" opacity="0.3"/>
    <line x1="4" y1="-2" x2="4" y2="2" stroke="#2B2B23" stroke-width="0.8" opacity="0.3"/>
  </g>
  <!-- Small accent -->
  <circle cx="18" cy="20" r="3" fill="#CDD917" opacity="0.5"/>
</svg>
