<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DDD8E8"/>
      <stop offset="100%" stop-color="#C8C0D8"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" rx="20" fill="url(#bg)"/>
  <!-- Cocktail glass -->
  <g transform="translate(40,40)">
    <!-- Glass bowl -->
    <path d="M-16-14 L0 8 L16-14Z" fill="white" fill-opacity="0.6" stroke="#2B2B23" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Liquid -->
    <path d="M-12-10 L-2 4 L8-10Z" fill="#CDD917" opacity="0.7"/>
    <!-- Stem -->
    <line x1="0" y1="8" x2="0" y2="20" stroke="#2B2B23" stroke-width="2" stroke-linecap="round"/>
    <!-- Base -->
    <ellipse cx="0" cy="20" rx="10" ry="2.5" fill="#2B2B23"/>
    <!-- Olive on pick -->
    <line x1="-4" y1="-8" x2="8" y2="-14" stroke="#2B2B23" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="8" cy="-14" r="3.5" fill="#8DB255" stroke="#2B2B23" stroke-width="1"/>
    <circle cx="8" cy="-14" r="1.2" fill="#D94B3A"/>
  </g>
</svg>
