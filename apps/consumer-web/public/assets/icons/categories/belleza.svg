<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2E4E8"/>
      <stop offset="100%" stop-color="#E5D0D8"/>
    </linearGradient>
    <linearGradient id="lipstick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D94B6A"/>
      <stop offset="100%" stop-color="#B83050"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" rx="20" fill="url(#bg)"/>
  <!-- Lipstick body -->
  <g transform="translate(40,42) rotate(-15)">
    <!-- Tube base -->
    <rect x="-7" y="2" width="14" height="22" rx="2" fill="#2B2B23"/>
    <!-- Tube band -->
    <rect x="-7" y="0" width="14" height="6" rx="1" fill="#3D3D33"/>
    <!-- Lipstick tip -->
    <rect x="-6" y="-12" width="12" height="14" rx="1" fill="url(#lipstick)"/>
    <!-- Lipstick angled top -->
    <path d="M-6-12 L6-12 L6-18 Q0-22-6-14 Z" fill="url(#lipstick)"/>
    <!-- Shine -->
    <rect x="-3" y="-16" width="2" height="10" rx="1" fill="white" opacity="0.3"/>
  </g>
  <!-- Sparkle -->
  <g transform="translate(56,20)">
    <path d="M0-5 L1.2-1.2 5 0 1.2 1.2 0 5-1.2 1.2-5 0-1.2-1.2Z" fill="#CDD917" stroke="#2B2B23" stroke-width="0.5"/>
  </g>
</svg>
