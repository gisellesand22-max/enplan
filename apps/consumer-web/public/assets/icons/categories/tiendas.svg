<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8E0D0"/>
      <stop offset="100%" stop-color="#D8CEB8"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C87A"/>
      <stop offset="100%" stop-color="#D4A054"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" rx="20" fill="url(#bg)"/>
  <!-- Shopping bag -->
  <g transform="translate(40,42)">
    <!-- Bag body -->
    <path d="M-16-6 L-14 18 C-14 20-12 22-10 22 L10 22 C12 22 14 20 14 18 L16-6Z" fill="url(#bag)" stroke="#2B2B23" stroke-width="1.5"/>
    <!-- Bag top fold -->
    <path d="M-16-6 L16-6" stroke="#2B2B23" stroke-width="1.5"/>
    <!-- Handles -->
    <path d="M-8-6 C-8-6-8-18 0-18 C8-18 8-6 8-6" fill="none" stroke="#2B2B23" stroke-width="2" stroke-linecap="round"/>
    <!-- Clasp -->
    <circle cx="0" cy="4" r="3" fill="#2B2B23"/>
    <circle cx="0" cy="4" r="1.5" fill="#CDD917"/>
    <!-- Texture line -->
    <line x1="-10" y1="12" x2="10" y2="12" stroke="#2B2B23" stroke-width="0.6" opacity="0.2"/>
  </g>
</svg>
