<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D8DDE8"/>
      <stop offset="100%" stop-color="#C0C8D8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D6D0C4"/>
      <stop offset="50%" stop-color="#A8A294"/>
      <stop offset="100%" stop-color="#D6D0C4"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" rx="20" fill="url(#bg)"/>
  <!-- Wrench -->
  <g transform="translate(40,40) rotate(-45)">
    <!-- Handle -->
    <rect x="-4" y="-2" width="30" height="6" rx="3" fill="url(#metal)" stroke="#2B2B23" stroke-width="1.2"/>
    <!-- Wrench head -->
    <path d="M-4-8 C-12-8-16-3-16 0 C-16 3-12 8-4 8 L-4 4 C-8 4-10 2-10 0 C-10-2-8-4-4-4Z" fill="url(#metal)" stroke="#2B2B23" stroke-width="1.2"/>
  </g>
  <!-- Gear accent -->
  <g transform="translate(22,22)">
    <circle cx="0" cy="0" r="5" fill="#CDD917" stroke="#2B2B23" stroke-width="1"/>
    <circle cx="0" cy="0" r="2" fill="#2B2B23"/>
  </g>
</svg>
